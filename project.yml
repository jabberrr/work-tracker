# XcodeGen spec — run `xcodegen generate` to create Worklog.xcodeproj (not committed).
# Placeholders to replace before shipping: com.example.worklog (bundle id), iCloud.com.example.worklog
# (CloudKit container, also in Worklog/Resources/Worklog.entitlements and AppConstants.swift).
# Signing: Config/Signing.xcconfig builds without a team by default (ad-hoc, WorklogLocal.entitlements). Put your team in
# the git-ignored Config/Local.xcconfig (see Config/Local.xcconfig.example) to enable iCloud + Sign in with Apple.
name: Worklog
options:
  bundleIdPrefix: com.example          # CHANGE ME
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Worklog:
    type: application
    platform: macOS
    sources:
      - path: Worklog
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Worklog/Resources/Info.plist
      properties:
        CFBundleName: Worklog
        CFBundleDisplayName: Worklog
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSHumanReadableCopyright: "© 2026"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.worklog   # CHANGE ME
        PRODUCT_NAME: Worklog
        # Values come from Config/Signing.xcconfig (+ optional Config/Local.xcconfig).
        DEVELOPMENT_TEAM: $(WORKLOG_TEAM)
        CODE_SIGN_IDENTITY: $(WORKLOG_SIGN_IDENTITY)
        CODE_SIGN_ENTITLEMENTS: $(WORKLOG_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  WorklogTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WorklogTests
    dependencies:
      - target: Worklog
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        DEVELOPMENT_TEAM: $(WORKLOG_TEAM)
        CODE_SIGN_IDENTITY: $(WORKLOG_SIGN_IDENTITY)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.worklog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Worklog.app/Contents/MacOS/Worklog"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Worklog:
    build:
      targets:
        Worklog: all
        WorklogTests: [test]
    test:
      targets: [WorklogTests]
      gatherCoverageData: true
